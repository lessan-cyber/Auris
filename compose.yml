    postgres:
        container_name: database
        image: postgres:17-alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5

    rustfs:
        image: rustfs/rustfs:latest
        container_name: storage
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
        command: server /data --console-address ":9001"
        volumes:
            - rustfs_data:/data
        healthcheck:
            test:
                [
                    "CMD",
                    "sh",
                    "-c",
                    "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
    rustfs-init:
        image: rustfs/rc:latest
        depends_on:
            rustfs:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            echo 'waiting for RustFS...';
            sleep 5;
            rc alias set local http://rustfs:9000 ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY};
            rc mb local/${RUSTFS_BUCKET_NAME} || echo 'bucket already exists';
            rc anonymous set download local/${RUSTFS_BUCKET_NAME} || echo 'anonymous download already set';
            exit 0;
            "

volumes:
    postgres_data:
    rustfs_data:
