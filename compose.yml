---
services:
    api:
        image: ghcr.io/lessan-cyber/auris/backend:latest
        container_name: auris-api
        ports:
            - "8001:8000"
        environment:
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - RUSTFS_ENDPOINT=http://rustfs:9000
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
            - RUSTFS_BUCKET_NAME=${RUSTFS_BUCKET_NAME}
            - BIND_ADDR=0.0.0.0:8000
            - RUST_LOG=info
            - CORS_ALLOWED_ORIGINS=http://localhost:8000
        command: ["backend", "--execution-mode", "api"]
        depends_on:
            postgres:
                condition: service_healthy
            rustfs:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 5

    worker:
        image: ghcr.io/lessan-cyber/auris/backend:latest
        container_name: auris-worker
        environment:
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - RUSTFS_ENDPOINT=http://rustfs:9000
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
            - RUSTFS_BUCKET_NAME=${RUSTFS_BUCKET_NAME}
            - RUST_LOG=info
        command: ["backend", "--execution-mode", "worker"]
        depends_on:
            postgres:
                condition: service_healthy
            rustfs:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    migrate:
        image: ghcr.io/lessan-cyber/auris/backend:latest
        container_name: auris-migrator
        environment:
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - RUSTFS_ENDPOINT=http://rustfs:9000
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
            - RUSTFS_BUCKET_NAME=${RUSTFS_BUCKET_NAME}
            - RUST_LOG=info
        command: ["backend", "--execution-mode", "migrate"]
        depends_on:
            postgres:
                condition: service_healthy
            rustfs:
                condition: service_healthy

    frontend:
        image: ghcr.io/lessan-cyber/auris/frontend:latest
        container_name: auris-frontend
        ports:
            - "8000:8080"
        volumes:
            - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - api

    postgres:
        container_name: database
        image: postgres:18-alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5

    rustfs:
        image: rustfs/rustfs:latest
        container_name: storage
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
        command: server /data --console-address ":9001"
        volumes:
            - rustfs_data:/data
        healthcheck:
            test:
                [
                    "CMD",
                    "sh",
                    "-c",
                    "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    rustfs-init:
        image: rustfs/rc:latest
        depends_on:
            rustfs:
                condition: service_healthy
        environment:
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
            - RUSTFS_BUCKET_NAME=${RUSTFS_BUCKET_NAME}
        entrypoint: >
            /bin/sh -c "
            echo 'waiting for RustFS...';
            sleep 5;
            rc alias set local http://rustfs:9000 ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY};
            rc mb local/${RUSTFS_BUCKET_NAME} || echo 'bucket already exists';
            rc anonymous set download local/${RUSTFS_BUCKET_NAME} || echo 'anonymous download already set';
            exit 0;
            "

volumes:
    postgres_data:
    rustfs_data:
